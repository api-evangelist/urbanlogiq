apis:
- name: UrbanLogiq Platform API
  description: >-
    The signed-request platform API behind the UrbanLogiq community
    intelligence platform — data catalog objects, aggregate queries, and
    streams served in Apache Arrow, Parquet, CSV, XLSX, JSON, text, and HTML;
    drive file storage; a directory of users, groups, and principals; ACL
    sharing and permissions; inbox notifications; API key management;
    schematic evaluator jobs; and session bootstrap. Authenticated with
    UL1-ED25519 signed requests via the official open source multi-language
    ulsdk (v0.8.0).
