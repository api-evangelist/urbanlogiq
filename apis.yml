aid: urbanlogiq
name: UrbanLogiq
description: >-
  UrbanLogiq (CommunityLogiq Software, Inc.) is a community intelligence
  platform that helps government leaders make faster, data-driven decisions by
  unifying siloed departmental data across transportation, planning, public
  safety, and economic development. The platform spans data integration,
  predictive modeling, cross-domain analytics, and governed generative AI
  (Ethica), and is served by a signed-request platform API with an official
  open source multi-language SDK (C++, Go, Java, Python, Rust, TypeScript) and
  CLI. Customers include the City of Toronto, Chicago DOT, the State of
  Hawaii, and Texas DOT; the service runs in separate US and Canada
  environments for data residency and is ISO/IEC 27001, 27701, 27017, and
  27018 certified.
